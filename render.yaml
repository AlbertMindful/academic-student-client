services:
  - type: web
    name: academic-student-client
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/auth/session
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: NODE_ENV
        value: production
      - key: ACADEMIC_DATA_SOURCE
        value: real
      - key: ACADEMIC_COOKIE_SECURE
        value: "true"
      - key: ACADEMIC_SESSION_TTL_MS
        value: "2592000000"
      - key: ACADEMIC_CREDENTIAL_TTL_MS
        value: "15552000000"
      - key: CHAOXING_SESSION_TTL_MS
        value: "15552000000"
      - key: ACADEMIC_SESSION_SECRET
        generateValue: true
      # 在 Render 控制台中安全设置 Neon 的 pooled connection string。
      - key: DATABASE_URL
        sync: false
